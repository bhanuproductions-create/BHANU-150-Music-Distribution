<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHANU 150 Music Distribution | Full Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #050507;
            color: #f4f4f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #0e0e12;
            border: 1px solid #1f1f23;
            padding: 35px;
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        h2 {
            color: #fff;
            margin-bottom: 6px;
            font-size: 24px;
            text-align: center;
        }
        .subtitle {
            color: #a1a1aa;
            font-size: 13px;
            margin-bottom: 25px;
            text-align: center;
        }
        .group {
            margin-bottom: 16px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #d4d4d8;
        }
        input, select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #27272a;
            background: #141418;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #a855f7;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            border: none;
            border-radius: 8px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            margin-top: 10px;
            font-size: 15px;
            transition: opacity 0.3s;
        }
        .submit-btn:hover {
            opacity: 0.9;
        }
        .support-info {
            font-size: 12px;
            color: #71717a;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>BHANU 150</h2>
        <p class="subtitle">Global Music Distribution Portal</p>
        
        <div class="group">
            <label>Artist / Band Name</label>
            <input type="text" id="artistName" placeholder="Enter artist name" required autocomplete="off">
        </div>

        <div class="group">
            <label>Song Title</label>
            <input type="text" id="songTitle" placeholder="Enter song title" required autocomplete="off">
        </div>

        <div class="group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="artist@gmail.com" required autocomplete="off">
        </div>

        <div class="group">
            <label>Primary Music Store</label>
            <select id="store">
                <option value="All Platforms (Spotify, Apple, JioSaavn, etc.)">All Platforms (150+ Stores)</option>
                <option value="Spotify Only">Spotify Only</option>
                <option value="Apple Music Only">Apple Music Only</option>
                <option value="JioSaavn & Wynk">JioSaavn & Wynk</option>
            </select>
        </div>

        <div class="group">
            <label>Audio File Link (Google Drive / Dropbox)</label>
            <input type="url" id="audioLink" placeholder="Paste your audio link here" required>
        </div>

        <button class="submit-btn" onclick="submitFullDetails()">Submit & Send via WhatsApp</button>

        <div class="support-info">
            Helpline: 9705180655
        </div>
    </div>

    <script>
        function submitFullDetails() {
            let artist = document.getElementById('artistName').value;
            let song = document.getElementById('songTitle').value;
            let email = document.getElementById('email').value;
            let store = document.getElementById('store').value;
            let link = document.getElementById('audioLink').value;

            if(!artist || !song || !email || !link) {
                alert("దయచేసి అన్ని వివరాలను పూర్తిగా ఎంటర్ చేయండి!");
                return;
            }

            // పూర్తి వివరాలతో వాట్సాప్ మెసేజ్ ఫార్మాట్ తయారవుతుంది
            let message = "🎵 *NEW MUSIC SUBMISSION*%0A" +
                          "👤 *Artist:* " + encodeURIComponent(artist) + "%0A" +
                          "🎶 *Song Title:* " + encodeURIComponent(song) + "%0A" +
                          "📧 *Email:* " + encodeURIComponent(email) + "%0A" +
                          "🌐 *Platform:* " + encodeURIComponent(store) + "%0A" +
                          "🔗 *Audio Link:* " + encodeURIComponent(link);

            let url = "https://wa.me/919705180655?text=" + message;
            window.location.href = url;
        }
    </script>
</body>
</html>
